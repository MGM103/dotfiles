# --- General Settings ---
set -g default-terminal "tmux-256color"

set-option -ga terminal-overrides ",xterm-256color:RGB"
set -s set-clipboard on
set -g allow-passthrough on

set-option -g escape-time 0
set -g status-interval 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status Bar Appearance ---
set -g status-position top
set -g status 2
set -g 'status-format[1]' ''
set -g window-status-separator " "
# tmux defaults this to `underscore`, which draws a stray accent-coloured line
# through the active pill's rounded left cap. Clear attributes on current tab.
set -g window-status-current-style default

# --- Keybindings ---
unbind C-b
set-option -g prefix C-Space
bind -n C-Space send-prefix

bind H split-window -v
bind V split-window -h
bind h select-pane -L \; refresh-client -S
bind j select-pane -D \; refresh-client -S
bind k select-pane -U \; refresh-client -S
bind l select-pane -R \; refresh-client -S

# Vi-mode Copying
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# --- Palette: Catppuccin Frappé fallback ---
# Stock Frappé values; used as-is on non-Omarchy machines (e.g. WSL).
set -g @thm_bg "#303446"
set -g @thm_fg "#c6d0f5"
set -g @thm_rosewater "#f2d5cf"
set -g @thm_flamingo "#eebebe"
set -g @thm_pink "#f4b8e4"
set -g @thm_mauve "#ca9ee6"
set -g @thm_red "#e78284"
set -g @thm_maroon "#ea999c"
set -g @thm_peach "#ef9f76"
set -g @thm_yellow "#e5c890"
set -g @thm_green "#a6d189"
set -g @thm_teal "#81c8be"
set -g @thm_sky "#99d1db"
set -g @thm_sapphire "#85c1dc"
set -g @thm_blue "#8caaee"
set -g @thm_lavender "#babbf1"
set -g @thm_subtext_1 "#a5adce"
set -g @thm_subtext_0 "#b5bfe2"
set -g @thm_overlay_2 "#949cbb"
set -g @thm_overlay_1 "#838ba7"
set -g @thm_overlay_0 "#737994"
set -g @thm_surface_2 "#626880"
set -g @thm_surface_1 "#51576d"
set -g @thm_surface_0 "#414559"
set -g @thm_mantle "#292c3c"
set -g @thm_crust "#232634"

# --- Omarchy Theme Override ---
# Generated by ~/.local/bin/tmux-theme-palette from the active theme's
# colors.toml; absent on non-Omarchy machines (e.g. WSL).
if-shell 'test -f ~/.cache/tmux/theme-palette.conf' 'source-file ~/.cache/tmux/theme-palette.conf'

# --- Status Bar: Pill Tabs ---
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}]#[fg=#{@thm_mantle},reverse]#[none]#I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #W#[fg=#{@thm_mantle},reverse]#[none]"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}]#[fg=#{@thm_mantle},reverse]#[none]#I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #W#[fg=#{@thm_mantle},reverse]#[none]"

# --- Status Bar: Modules ---
# One accent per tab, mirroring upstream catppuccin/tmux#v2.1.0 defaults
# (directory=rosewater, host=mauve, session=green/red-on-prefix). On Omarchy
# the palette override above remaps these to the active theme's colors
# (cyan / accent / bright_green); on WSL they fall back to stock Frappé.
# NOTE: plain #{@thm_...} refs only inside @bar_* — never #{E:@thm_...}.
# status-right expands these via #{E:@bar_...}, and E re-expands the result
# as a format, so an uppercase hex like matte-black's #FFC107 gets eaten
# (#F = window flags → "*FC107", an invalid colour). Plain refs insert literally.
set -g @bar_directory "#[fg=#{@thm_rosewater}]#[bg=default]#[fg=#{@thm_crust},bg=#{@thm_rosewater}] #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #{b:pane_current_path}#[bg=default]#[fg=#{@thm_surface_1}]"
set -g @bar_host "#[fg=#{@thm_mauve}]#[bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve}]󰒋 #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #H#[bg=default]#[fg=#{@thm_surface_1}]"
set -g @bar_session "#[fg=#{?client_prefix,#{@thm_red},#{@thm_green}}]#[bg=default]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}] #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #S#[bg=default]#[fg=#{@thm_surface_1}]"
set -g status-right "#{E:@bar_directory} #{E:@bar_host} #{E:@bar_session}"
set -g status-right-length 200
set -g status-left ""

# --- Derived Styles (baked fresh after the override above) ---
set -gF message-style "fg=#{@thm_fg},bg=default,align=centre"
set -gF message-command-style "fg=#{@thm_fg},bg=default,align=centre"
set -gF pane-border-style "fg=#{@thm_overlay_0}"
set -gF pane-active-border-style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF clock-mode-colour "#{@thm_blue}"
set -gF window-status-activity-style "bg=#{@thm_lavender},fg=#{@thm_crust}"
set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_crust}"

%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_surface_1}"
%endif

set -g status-style bg=default

# Relay extended (kitty/CSI-u) keys so TUIs can distinguish ctrl+h, ctrl+j, ctrl+enter.
set -s extended-keys on
set -s extended-keys-format csi-u
